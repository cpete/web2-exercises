<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusNotes</title>
  <meta name="description" content="Notizen und Mensaplan für den Campus">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="/css/style.css">
  <!-- Übung 1: Web App Manifest, Farbe der Browser-UI, Icon für iOS -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0f766e">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body>
  <header class="app-header">
    <h1>CampusNotes</h1>
    <span id="status" class="status" aria-live="polite"></span>
  </header>

  <main class="app-main">
    <section class="card">
      <h2>Notizen</h2>
      <form id="note-form" class="note-form">
        <label for="note-input" class="visually-hidden">Neue Notiz</label>
        <input id="note-input" type="text" placeholder="Neue Notiz …" required maxlength="200" autocomplete="off">
        <button type="submit">Hinzufügen</button>
      </form>
      <ul id="note-list" class="note-list"></ul>
    </section>

    <section class="card">
      <h2>Mensa heute <small id="menu-meta" class="meta"></small></h2>
      <ul id="menu-list" class="menu-list"><li>Lade Speiseplan …</li></ul>
    </section>
  </main>

  <footer class="app-footer">CampusNotes · Stand <span id="app-version"></span></footer>

  <div id="update-banner" class="update-banner" role="status" hidden>
    <span>Neue Version verfügbar.</span>
    <button id="update-button" type="button">Jetzt aktualisieren</button>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
