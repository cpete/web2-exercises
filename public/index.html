<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Search</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 480px;
        margin: 4rem auto;
        padding: 0 1rem;
        color: #1a1a1a;
      }
      h1 {
        font-size: 1.25rem;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        font-size: 1rem;
        padding: 0.5rem 0.75rem;
        border: 1px solid #ccc;
        border-radius: 6px;
      }
      ul {
        list-style: none;
        margin: 0.5rem 0 0;
        padding: 0;
        border: 1px solid #eee;
        border-radius: 6px;
        overflow: hidden;
      }
      li {
        padding: 0.5rem 0.75rem;
        border-bottom: 1px solid #eee;
      }
      li:last-child {
        border-bottom: none;
      }
      .empty {
        color: #888;
        font-style: italic;
      }
      .spinner {
        display: none;
        width: 1rem;
        height: 1rem;
        margin: 0.75rem auto 0;
        border: 2px solid #ccc;
        border-top-color: #1a1a1a;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
      }
      .spinner.visible {
        display: block;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <h1>Word search</h1>
    <input type="search" id="query" placeholder="Start typing..." autocomplete="off" />
    <div id="spinner" class="spinner" aria-hidden="true"></div>
    <ul id="results"></ul>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/rxjs/7.8.1/rxjs.umd.min.js"></script>
    <script>
      const { fromEvent, from, of, merge, EMPTY } = rxjs;
      const {
        map,
        filter,
        debounceTime,
        distinctUntilChanged,
        switchMap,
        mergeMap,
        tap,
        catchError,
        finalize,
      } = rxjs;

      const input = document.getElementById("query");
      const results = document.getElementById("results");
      const spinner = document.getElementById("spinner");

      // Render the search results in a list.
      function render(words) {
        results.innerHTML = "";
        if (words.length === 0) {
          const li = document.createElement("li");
          li.className = "empty";
          li.textContent = "No matches";
          results.appendChild(li);
          return;
        }
        for (const word of words) {
          const li = document.createElement("li");
          li.textContent = word;
          results.appendChild(li);
        }
      }

      // The base URL of the API server.
      const API_BASE = `${location.protocol}//${location.hostname}:3000`;

      // Perform a search query and return an observable of the results.
      function search(query) {
        spinner.classList.add("visible");
        return from(fetch(`${API_BASE}/api/search?q=${encodeURIComponent(query)}`)).pipe(
          // mergeMap just flattens the response.json() promise; there's only
          // ever one outer emission here, so no cancellation semantics apply.
          mergeMap((response) => (response.ok ? response.json() : of([]))),
          catchError(() => of([])),
          finalize(() => spinner.classList.remove("visible")),
        );
      }

      const query$ = fromEvent(input, "input").pipe(map(() => input.value.trim()));

      merge(
        // Short queries clear the results immediately, with no debounce.
        query$.pipe(filter((query) => query.length < 3)),
        // Debounce longer queries by 300ms to avoid making too many requests.
        query$.pipe(
          filter((query) => query.length >= 3),
          debounceTime(300),
          distinctUntilChanged(),
        ),
      )
        .pipe(
          tap((query) => {
            if (query.length < 3) {
              results.innerHTML = "";
              spinner.classList.remove("visible");
            }
          }),
          // switchMap ensures that going back to a short query cancels any
          // in-flight search, so a stale response can't overwrite the clear.
          switchMap((query) => (query.length >= 3 ? search(query) : EMPTY)),
        )
        .subscribe(render);
    </script>
  </body>
</html>
